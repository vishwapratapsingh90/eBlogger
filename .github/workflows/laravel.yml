name: Laravel CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    env:
      APP_NAME: eBlogger
      APP_ENV: testing
      APP_KEY: base64:D7lBqVsunucDx6zCoIsRBYjpH7XtjOBz5q6pSaPm3SU=
      APP_DEBUG: true
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: eBlogger
      DB_USERNAME: sail
      DB_PASSWORD: password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MAIL_MAILER: log
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: debug

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: eBlogger
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, redis, intl, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-suggest

      - name: Prepare Laravel app
        run: |
          php artisan config:clear
          php artisan key:generate --force
          php artisan migrate --force

      - name: Run Pest tests
        run: ./vendor/bin/pest --colors=never
